# Weekly update proposals for the Maven dependencies and plugins (pom.xml) and the pinned actions.
# This repository is published from the one the SDK is developed in, so a proposal here is applied
# there and arrives with the next release; the pull request is then closed with a link to it.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    # A new major of a library the SDK exposes (Jackson, through the models) or of the model
    # generator changes what callers compile against: taken on purpose, not as a routine update.
    ignore:
      - dependency-name: "com.fasterxml.jackson*:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.openapitools:openapi-generator"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # A new major version of an action changes its inputs or its runtime: taken on purpose, with
    # the workflows checked, not merged as a routine update.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
